name: quizzgenius
description: "Quiz-Genius - Générez des quiz intelligents à partir de vos cours grâce à l'IA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  provider: ^6.1.5
  shared_preferences: ^2.3.4
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  intl: ^0.19.0
  file_picker: ^11.0.2
  syncfusion_flutter_pdf: ^33.1.49
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.1
  flutter_dotenv: ^5.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env

